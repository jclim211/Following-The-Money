/* ===== Page and container contrast: in light mode the page is grey and containers are white with a visible edge ===== */
:root { --page-bg: var(--ds-surface); --card-border: var(--ds-border); --card-shadow: none; }
html[data-color-mode="light"] { --page-bg: #F0F1F2; --card-border: #DDDEE1; --card-shadow: var(--ds-shadow-raised); }
html[data-color-mode="light"][data-contrast-mode="more"] { --page-bg: #F0F1F2; --card-border: var(--ds-border-bold); }

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; background: var(--page-bg); }
html[data-color-mode="dark"] { color-scheme: dark; }
body { margin: 0; background: var(--page-bg); color: var(--ds-text); font: var(--ds-font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--ds-link); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: var(--ds-border-width-focused) solid var(--ds-border-focused); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 16px; height: 16px; flex: 0 0 auto; display: inline-block; vertical-align: -3px; }
.ic svg { display: block; width: 100%; height: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Layout: top navigation + side navigation + main (as on atlassian.design) ===== */
.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 56px minmax(0, 1fr); min-height: 100vh; }
.topnav { grid-column: 1 / -1; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--ds-space-100); height: 56px; padding: 0 var(--ds-space-300) 0 var(--ds-space-200); background: var(--ds-surface); border-bottom: var(--ds-border-width) solid var(--ds-border); }
.brand { display: inline-flex; align-items: center; gap: var(--ds-space-100); color: var(--ds-text); text-decoration: none !important; border-radius: var(--ds-radius-medium); padding: var(--ds-space-050); cursor: pointer; border: 0; background: none; }
.brand-mark { display: inline-flex; gap: 2px; align-items: center; }
.brand-mark svg { display: block; }
.brand-name { font: var(--ds-font-heading-medium); letter-spacing: -0.01em; white-space: nowrap; }
.tn-spacer { flex: 1 1 auto; }

/* ---------- navigation: the same pages as the Streamlit sidebar, grouped by run ---------- */

  const key = JSON.stringify(runs.map(r => r.run));
  if (key === runsKey) return;
  runsKey = key; DATA.runs = runs;
  LATEST = runs.length ? runs[0].run : null;
  if (!selectedRun || !runs.some(r => r.run === selectedRun)) selectedRun = LATEST;
  if (LATEST) OPEN_GROUPS.add(LATEST);
  PAGES.length = 0;
  PAGES.push({ section: "Overview", items: [{ path: "home", title: "Home", icon: "home", kind: "home" }] },
    { section: "HI-Medium (current)", group: "current", items: [
      { path: "bq1", title: "BQ1 Account Profiles", icon: "chart-bar", kind: "bq1", run: null },
      { path: "bq2", title: "BQ2 Cross-bank Movement", icon: "data-flow", kind: "bq2", run: null }] });
  runs.forEach(r => PAGES.push({ section: r.run, group: r.run, items: [
    { path: `${r.run}-bq1`, title: "BQ1 Account Profiles", icon: "chart-bar", kind: "bq1", run: r.run },
    { path: `${r.run}-bq2`, title: "BQ2 Cross-bank Movement", icon: "data-flow", kind: "bq2", run: r.run }] }));
  Object.keys(BY_PATH).forEach(k => delete BY_PATH[k]);
  PAGES.forEach(s => s.items.forEach(i => { BY_PATH[i.path] = { ...i, section: s.section }; }));

}

  const runGroups = PAGES.filter(s => s.group && s.group !== "current");

/* ---------- multi-select (ADS checkbox select), starts with the top n ---------- */
const STATE = {};

function multiSelect(el, key, options, n, onChange, meta = {}) {
  if (!STATE[key]) STATE[key] = options.slice(0, n);
  const draw = () => {
    const chosen = options.filter(o => STATE[key].includes(o));
    el.innerHTML = `
      <div class="select">
        <div class="sel-ctl" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-label="Values shown">
          ${chosen.map(o => `<span class="mtag"><span>${esc(o)}</span><button aria-label="Remove ${esc(o)}" data-rm="${esc(o)}">${ic("cross")}</button></span>`).join("")}
          ${chosen.length < options.length ? `<span class="sel-ph">Add values</span>` : ""}
          <span class="chev">${ic("chevron-down")}</span>
        </div>
      </div>
      <div class="sel-foot"><span>Showing ${chosen.length} of ${options.length}</span>${chosen.length !== Math.min(n, options.length) || chosen.some((o, i) => o !== options[i]) ? `<button class="linkbtn" data-reset>Back to top ${n}</button>` : ""}</div>`;

      if (sel.classList.contains("open")) { sel.classList.remove("open"); $(".sel-menu", sel).remove(); ctl.setAttribute("aria-expanded", "false"); return; }
      sel.classList.add("open"); ctl.setAttribute("aria-expanded", "true");
      const menu = document.createElement("div");
      menu.className = "sel-menu"; menu.setAttribute("role", "listbox"); menu.setAttribute("aria-multiselectable", "true");
      menu.innerHTML = options.map((o, i) => `<button class="opt" role="option" data-opt="${esc(o)}" aria-selected="${STATE[key].includes(o)}"><span class="cbx">${ic("check-mark")}</span><span>${esc(o)}</span><span class="meta">${meta[o] || "#" + (i + 1)}</span></button>`).join("");
      sel.appendChild(menu);
      menu.addEventListener("click", e => {
        e.stopPropagation();
        const b = e.target.closest("[data-opt]"); if (!b) return;
        const o = b.dataset.opt, on = STATE[key].includes(o);
        if (on && STATE[key].length === 1) return;  // keep at least one value
        STATE[key] = on ? STATE[key].filter(x => x !== o) : [...STATE[key], o];
        b.setAttribute("aria-selected", String(!on));
        refresh(true);
      });
    };
    ctl.addEventListener("click", e => { e.stopPropagation(); if (e.target.closest("[data-rm]")) return; openMenu(); });
    ctl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") { e.preventDefault(); openMenu(); } });
    el.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      if (STATE[key].length === 1) return;

    }));
    const r = $("[data-reset]", el); if (r) r.addEventListener("click", e => { e.stopPropagation(); STATE[key] = options.slice(0, n); refresh(false); });
  };
  const refresh = keepOpen => {
    const wasOpen = keepOpen && $(".select.open", el);
    const menuScroll = wasOpen ? $(".sel-menu", el).scrollTop : 0;
    draw();
    if (wasOpen) { $(".sel-ctl", el).click(); $(".sel-menu", el).scrollTop = menuScroll; }
    onChange(options.filter(o => STATE[key].includes(o)));
  };
  draw();
  onChange(options.filter(o => STATE[key].includes(o)));
}

/* ---------- charts: grouped bars, laundering vs normal, hover highlight + tooltip ---------- */
const GROUPS = [["laundering", "Laundering", "b-l", "sw-l"], ["normal", "Normal", "b-n", "sw-n"]];
let measureCtx;

  return `<b>${esc(cat)}</b><table>${rows.map(r => `<tr><td><i class="${r.sw}"></i>${r.label}</td><td>${r.value}</td></tr>`).join("")}${(extra || []).map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table>`;
}
function bindHover(wrap, getTip) {

    g.addEventListener("mouseenter", () => { wrap.classList.add("hovering"); g.classList.add("on"); });
    g.addEventListener("mousemove", e => showTip(getTip(g.dataset.cat), e.clientX, e.clientY));
    g.addEventListener("mouseleave", () => { wrap.classList.remove("hovering"); g.classList.remove("on"); hideTip(); });

function hbars(wrap, rows, show, tipFor) {

  const bar = 12, gap = 3, groupGap = 18, top = 4, axisH = 22;
  const H = top + show.length * (2 * bar + gap) + (show.length - 1) * groupGap + axisH + 6;
  const mx = niceMax(Math.max(...rows.filter(r => show.includes(r.cat)).flatMap(r => [r.laundering, r.normal]))), plotW = W - labelW - 40;
  const x = v => labelW + (v / mx) * plotW, ticks = [0, mx / 2, mx];

  s += ticks.map(t => `<text class="tick" x="${x(t)}" y="${H - 6}" text-anchor="middle">${pct(t)}</text>`).join("");

    s += `<text class="cat" x="${labelW - 10}" y="${y0 + bar + gap / 2 + 4}" text-anchor="end">${esc(cat)}</text>`;

      const v = r[g], y = y0 + k * (bar + gap);

      s += `<text class="val num" x="${x(v) + 6}" y="${y + bar - 2}">${pct(v)}</text>`;

}

  const mx = niceMax(Math.max(...rows.filter(r => show.includes(r.cat)).flatMap(r => [r.laundering, r.normal])));
  const y = v => top + plotH - (v / mx) * plotH, ticks = [0, mx / 2, mx];

function runMeta(r) {
  const mins = Math.round((new Date(r.finished) - new Date(r.started)) / 60000);
  return { when: r.finished.slice(0, 16).replace("T", " "), took: mins < 60 ? `${mins} min` : `${(mins / 60).toFixed(1)} h` };
}

const PIPE_STATUS = {
  incomplete: ["warning", "Missing files"], ready: ["information", "Ready to start"],
  running: ["discovery", "Running"], failed: ["danger", "Failed"], succeeded: ["success", "Finishing"],
};
const utc = iso => iso ? iso.slice(0, 16).replace("T", " ") : "";
function since(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
function pipeHead(extra = "") {
  return `<div class="pipe-h"><h2 class="h2xl"><span class="step">${ic("play")}</span>Start a pipeline run</h2>${extra}</div>
  <p class="lead">Upload one file into each of <code>transactions/</code>, <code>patterns/</code> and <code>accounts/</code> under
    <code>s3://is459-g7-projectbucket/runs/&lt;run-name&gt;/raw/</code>, then press Start. A finished run moves to step 1.</p>`;
}
function pipeInner() {
  if (!ST.pipe) return `${pipeHead()}<div class="pipe-empty">${ic("refresh")}<span>Checking S3 for new uploads…</span></div>`;
  const P = ST.pipe, ups = P.uploads || [], msg = P.msg;
  const needCode = P.can_start && !P.unlocked;
  const cards = ups.map(u => {
    const [tone, label] = PIPE_STATUS[u.status] || ["neutral", u.status], ex = u.execution;
    const files = ["transactions", "patterns", "accounts"].map(f => u.files[f]
      ? `<span class="lozenge success" title="${esc(u.files[f].name)}, ${u.files[f].mb} MB">${ic("check-mark")}${f}</span>`
      : `<span class="lozenge neutral" title="Upload a file to raw/${f}/">${ic("minus")}${f}</span>`).join("");
    const when = u.status === "running" && ex ? `Started ${utc(ex.started)} UTC, running for ${since(ex.started)}`
      : u.status === "failed" && ex ? `Stopped ${utc(ex.stopped)} UTC (${esc(ex.status.toLowerCase().replace("_", " "))}). See the execution in the Step Functions console.`
      : u.status === "succeeded" ? "Finished, saving the results"
      : u.status === "incomplete" ? `Still needed: ${u.missing.map(esc).join(", ")}`
      : u.uploaded ? `Uploaded ${utc(u.uploaded)} UTC` : "";
    const canGo = P.can_start && u.valid_name && (u.status === "ready" || u.status === "failed");
    const btn = u.status === "running" || u.status === "succeeded" ? ""
      : `<button class="btn ${canGo ? "primary" : ""}" data-start="${esc(u.run)}"${canGo ? "" : " disabled"}>${ic(u.status === "failed" ? "refresh" : "play")}<span>${u.status === "failed" ? "Retry" : "Start"}</span></button>`;
    return `<div class="upcard${u.status === "ready" ? " ready" : ""}">
      <div class="top">${spot("dataset", "sm")}<div class="t"><h3>${esc(u.run)}</h3><div class="sub">${u.dataset ? `${esc(u.dataset)} dataset` : "Dataset not known yet"}${u.valid_name ? "" : ". Rename the folder: lowercase letters, numbers and hyphens only"}</div></div><span class="lozenge ${tone}">${label}</span></div>
      <div class="files">${files}</div>
      ${u.status === "running" || u.status === "succeeded" ? `<div class="pbar" role="progressbar" aria-label="${esc(u.run)} is running"><span></span></div>` : ""}
      <div class="foot"><span class="sub">${when}</span>${btn}</div></div>`;
  }).join("");
  const refresh = `<div class="pipe-bar" style="display:flex;gap:var(--ds-space-100);align-items:center">${needCode ? `<input type="password" id="pipeCode" placeholder="Passcode to start runs" aria-label="Passcode to start runs" autocomplete="off" value="${esc(ST.pipeCode || "")}">` : ""}<button class="btn" id="pipeRefresh">${ic("refresh")}Check S3 again</button></div>`;
  return `${pipeHead(refresh)}
  ${msg ? `<div class="pipe-msg ${msg.ok ? "ok" : "err"}" role="status">${ic(msg.ok ? "check-circle" : "cross-circle")}<span>${esc(msg.text)}</span></div>` : ""}
  ${P.error ? `<div class="pipe-empty">${ic("information-circle")}<span>Could not read the uploads: ${esc(P.error)}</span></div>`
    : ups.length ? `<div class="grid ups">${cards}</div>`
    : `<div class="pipe-empty">${ic("information-circle")}<span>No new uploads. Every run folder in S3 has finished.</span></div>`}`;
}
function drawPipe() {
  const box = $("#pipeBox"); if (!box) return;

  schedulePoll();

/* Auto-refresh the home page: every 15 s while a run is going, otherwise every minute.
   A finished run then leaves the upload cards and appears in step 1 without a reload. */
function schedulePoll() {
  clearTimeout(ST.pipeTimer);
  const busy = (ST.pipe && ST.pipe.uploads || []).some(u => u.status === "running" || u.status === "succeeded");
  ST.pipeTimer = setTimeout(() => {
    if (currentPath !== "home") return;
    if (document.visibilityState === "hidden" || MODALS.length) return schedulePoll();
    ST.send({ path: "home", n: ++ST.n, action: "poll" });
  }, busy ? 15000 : 60000);
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-start]");
  if (s && !s.disabled) {
    const code = $("#pipeCode"); if (code) ST.pipeCode = code.value;
    s.disabled = true; s.querySelector("span:last-child").textContent = "Starting…";
    ST.send({ path: "home", n: ++ST.n, action: "start", run: s.dataset.start, passcode: ST.pipeCode || "" });
    return;
  }
  const r = e.target.closest("#pipeRefresh");
  if (r) { r.disabled = true; ST.send({ path: "home", n: ++ST.n, action: "refresh" }); }
});

const DIMS = [["payment_format", "Payment format"], ["border", "Border"], ["conversion", "Currency conversion"]];
function dimRows(dim) {
  const f = DATA.flow.filter(r => r.dimension === dim), cats = [...new Set(f.map(r => r.value))];
  const rows = cats.map(c => {
    const l = f.find(r => r.value === c && r.grp === "laundering") || {}, n = f.find(r => r.value === c && r.grp === "normal") || {};
    return { cat: c, laundering: l.share || 0, normal: n.share || 0, l_tx: l.n_tx || 0, n_tx: n.n_tx || 0, l_usd: l.usd_median, n_usd: n.usd_median };
  });
  return rows.sort((a, b) => b.laundering - a.laundering);
}

const rateFmt = v => { const p = v * 100; return (p < 1 ? p.toFixed(3) : p.toFixed(2)) + "%"; };
function stepper(id, label, value, min, max, step, unit = "") {
  return `<div class="stepper" id="${id}" role="group" aria-label="${esc(label)}">
    <button class="btn icon-only" data-step="-${step}" aria-label="Fewer"${value <= min ? " disabled" : ""}>${ic("minus")}</button>
    <input type="number" inputmode="numeric" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${esc(label)}">
    <button class="btn icon-only" data-step="${step}" aria-label="More"${value >= max ? " disabled" : ""}>${ic("add")}</button>${unit ? `<span class="unit">${unit}</span>` : ""}</div>`;
}
function wireStepper(el, min, max, onChange) {
  const input = $("input", el);
  const set = v => { v = Math.max(min, Math.min(max, Math.round(+v || min))); input.value = v; el.querySelector('[data-step^="-"]').disabled = v <= min; el.querySelector('[data-step]:not([data-step^="-"])').disabled = v >= max; onChange(v); };
  el.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => set(+input.value + +b.dataset.step)));
  input.addEventListener("change", () => set(input.value));
  input.addEventListener("keydown", e => { if (e.key === "Enter") set(input.value); });
}

/* ---------- screen 4: scheme explorer ---------- */
const TYPE_INFO = {
  "FAN-OUT": ["One account splits money and sends it to many accounts.", "Breaking one large sum into many smaller transfers keeps each one below reporting thresholds and spreads the money out (structuring, 'smurfing').", "One account with many outgoing arrows. It is the entry account; every receiver is an exit account."],
  "FAN-IN": ["Many accounts send money into one account.", "Collects money from many sources, often money mules, into one account before it is moved on or withdrawn.", "Many arrows pointing into one account. Every payer is an entry account; the collector is the exit account."],
  "GATHER-SCATTER": ["Fan-in then fan-out: many accounts pay one account, which then pays many others.", "The hub account mixes money from many sources, so it is hard to tell which incoming payment funds which outgoing one.", "Arrows into one hub account, then out of it. The payers are entry accounts, the final receivers exit accounts."],
  "SCATTER-GATHER": ["Fan-out then fan-in: one account pays many middle accounts, which all pay one final account.", "Layering: the middle accounts break the direct link between where the money starts and where it ends up.", "A diamond: one entry account, a fan of middle accounts, one collecting exit account."],
  "CYCLE": ["Money moves along a chain of accounts and comes back to the account it started from.", "Round-tripping: the money comes back to its owner looking like income from other parties.", "A loop. No account only sends or only receives, so entry = first sender and exit = last receiver, often the same bank."],
  "RANDOM": ["Money hops along a random path of accounts, with no fixed shape.", "No fixed shape, so simple pattern rules miss it; every hop adds distance from the source.", "A meandering chain of accounts with no hub, from the entry account to the exit account."],
  "BIPARTITE": ["A group of accounts pays another group of accounts (many to many, one layer).", "Many-to-many payments mix funds between two groups, so single flows are hard to follow.", "Two groups with arrows criss-crossing between them. Senders are entry accounts, receivers exit accounts."],
  "STACK": ["Two bipartite layers in a row: senders pay middle accounts, which pay final accounts.", "An extra layer of middle accounts adds distance and mixing on top of a bipartite pattern.", "Three groups: senders (entry accounts), middle accounts, receivers (exit accounts)."],

const AROLE = { entry: ["Entry account", "var(--il-1)"], exit: ["Exit account", "var(--il-4)"], both: ["Entry and exit account", "var(--il-2)"], mid: ["Middle account", "var(--mid-c)"] };

let SX = null;
function sx() {

  e.forEach(x => { add(touch, x.from_bank, x.scheme_id); add(touch, x.to_bank, x.scheme_id); });

  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scheme ${m.sid} diagram"><defs><marker id="ah${small ? "s" : "l"}${m.sid}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="${small ? 6 : 10}" markerHeight="${small ? 6 : 10}" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>`;

    const rr = mine && small ? R + 1.5 : R;

/* ---- the tab: bank map, top entry/exit banks, open any scheme, the eight types ---- */
function schemesTab(panel) {
  sx();
  const S = STATE.sx = STATE.sx || { n: 5 };
  panel.innerHTML = `
    <div class="section-h" style="margin-top:0"><div><h2><span class="h-art">${art("schemes", "mini")}</span>Bank map: which banks the schemes run through</h2>
      <p>Each circle is a bank; its size is the number of schemes through it. Arrows show scheme money moving between banks. Click a bank to open it.</p></div></div>
    <div class="card">
      <div class="card-h"><h3 id="mTitle"></h3><p id="mSub"></p></div>
      <div class="cf"><div class="cf-filter">
        <div class="flabel">${ic("filter")}Scheme types</div><div id="mTypes"></div>
        <div class="flabel" style="margin-top:var(--ds-space-200)">Banks on the map</div><div id="mNWrap"></div>
        <p class="fhint">Most schemes first. Links to banks not on the map go to one "Other banks" square in the middle.</p>

        <div class="chart bmap" id="mMap"></div></div></div>
    </div>
    <div class="grid g2" style="margin-top:var(--ds-space-200)">
      <div class="card"><div class="card-h"><h3>Top entry banks</h3><p>Where schemes put money in, for the types chosen</p></div><div id="mTopIn" class="blist"></div></div>
      <div class="card"><div class="card-h"><h3>Top exit banks</h3><p>Where schemes take money out, for the types chosen</p></div><div id="mTopOut" class="blist"></div></div>
    </div>
    <section class="section"><div class="section-h"><div><h2><span class="h-art">${art("launder", "mini")}</span>Open any scheme</h2><p>Every scheme opens in a popup with its diagram and transfers.</p></div></div>
      <div class="card"><div class="pickrow"><label class="flabel" for="anySch">Scheme, largest first</label><select id="anySch" class="sel-native"></select><button class="btn primary" id="anyGo">Open ${ic("arrow-right")}</button></div></div></section>
    <section class="section"><div class="section-h"><div><h2><span class="h-art">${art("share", "mini")}</span>The eight scheme types</h2><p>Each one drawn from a real scheme in the data, in the same style as the scheme popup.</p></div></div>
      <div class="tgrid" id="mTypesGrid"></div></section>`;

  const draw = () => {
    const types = STATE["map-types"], { e, stats } = mapStats(types);
    const top = stats.slice(0, S.n), topSet = new Set(top.map(x => x.b)), OTHER = -1;
    const links = {};
    e.forEach(x => {
      const a = topSet.has(x.from_bank) ? x.from_bank : OTHER, b = topSet.has(x.to_bank) ? x.to_bank : OTHER;
      if (a === b) return;
      const k = a + ">" + b, l = links[k] = links[k] || { a, b, s: new Set(), t: 0, usd: 0 }; l.s.add(x.scheme_id); l.t++; l.usd += x.usd;
    });
    const L = Object.values(links).map(l => ({ ...l, schemes: l.s.size }));
    const hasOther = L.some(l => l.a === OTHER || l.b === OTHER);
    $("#mTitle").textContent = `Top ${top.length} of ${stats.length} banks`;
    $("#mSub").textContent = `${types.length === SX.TYPES.length ? "All scheme types" : types.join(", ")}, ranked by the number of schemes through the bank.`;

    // layout: banks on a ring, grouped by role: entry banks on the left, exit banks on the right
    const wrap = $("#mMap"), W = Math.max(320, wrap.clientWidth), H = Math.max(360, Math.min(560, 260 + top.length * 10));
    const order = ["entry", "both", "exit", "pass"].flatMap(r => top.filter(x => x.role === r));
    const nE = top.filter(x => x.role === "entry").length, step = 2 * Math.PI / Math.max(order.length, 1);
    const t0 = Math.PI + (Math.max(nE, 1) - 1) / 2 * step;
    const rx = W / 2 - Math.min(150, W * .22), ry = H / 2 - 56, cx = W / 2, cy = H / 2;
    const P = new Map();
    if (order.length === 1) P.set(order[0].b, { x: cx - rx * .6, y: cy, t: Math.PI });
    else order.forEach((x, i) => { const t = t0 - i * step; P.set(x.b, { x: cx + rx * Math.cos(t), y: cy - ry * Math.sin(t), t }); });
    P.set(OTHER, { x: cx, y: cy, t: 0 });
    const maxN = Math.max(...top.map(x => x.n), 1), rad = x => x.b === OTHER ? 16 : 9 + 22 * Math.sqrt(x.n / maxN), maxL = Math.max(...L.map(l => l.schemes), 1);
    const R = new Map(top.map(x => [x.b, rad(x)])); R.set(OTHER, 16);
    let s = `<svg width="${W}" height="${H}" role="img" aria-label="Bank map"><defs><marker id="mah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>`;
    L.forEach(l => {
      const a = P.get(l.a), b = P.get(l.b), dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len, bend = Math.min(40, len * .14);
      const qx = (a.x + b.x) / 2 + nx * bend, qy = (a.y + b.y) / 2 + ny * bend;
      const sh = (p, d) => { const vx = qx - p.x, vy = qy - p.y, ll = Math.hypot(vx, vy) || 1; return [p.x + vx / ll * d, p.y + vy / ll * d]; };
      const [x0, y0] = sh(a, R.get(l.a) + 3), [x1, y1] = sh(b, R.get(l.b) + 5), d = `M${x0.toFixed(1)} ${y0.toFixed(1)}Q${qx.toFixed(1)} ${qy.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
      s += `<g class="mlink${l.a === OTHER || l.b === OTHER ? " oth" : ""}" data-a="${l.a}" data-b="${l.b}"><path class="hitp" d="${d}"/><path class="ln" d="${d}" style="stroke-width:${(1 + 4 * Math.sqrt(l.schemes / maxL)).toFixed(1)}" marker-end="url(#mah)"/></g>`;
    });
    if (hasOther) { const o = P.get(OTHER); s += `<g class="mnode other" data-b="${OTHER}"><rect x="${o.x - 16}" y="${o.y - 16}" width="32" height="32" rx="6"/><text class="cat" x="${o.x}" y="${o.y + 32}" text-anchor="middle">Other banks</text><text class="tick" x="${o.x}" y="${o.y + 45}" text-anchor="middle">${fmt(stats.length - top.length)} banks</text></g>`; }
    top.forEach(x => {
      const p = P.get(x.b), r = R.get(x.b), c = Math.cos(p.t), side = c > .35 ? "start" : c < -.35 ? "end" : "middle";
      const lx = side === "start" ? p.x + r + 8 : side === "end" ? p.x - r - 8 : p.x, ly = side === "middle" ? (Math.sin(p.t) > 0 ? p.y - r - 20 : p.y + r + 16) : p.y - 2;
      s += `<g class="mnode" data-b="${x.b}" tabindex="0" role="button" aria-label="${esc(SX.name(x.b))}, ${x.n} schemes"><circle class="mhalo" cx="${p.x}" cy="${p.y}" r="${r + 5}"/><circle cx="${p.x}" cy="${p.y}" r="${r}" style="fill:${ROLE[x.role][1]}"/>
        <text class="cat strong" x="${lx}" y="${ly}" text-anchor="${side}">${esc(SX.name(x.b))}</text><text class="tick" x="${lx}" y="${ly + 13}" text-anchor="${side}">${x.n} schemes · ${x.en} in · ${x.ex} out</text></g>`;
    });
    wrap.innerHTML = s + `</svg>`;
    // hover: a bank lights up its own links; a link shows its numbers
    $$(".mnode", wrap).forEach(g => {
      const b = +g.dataset.b, x = top.find(t => t.b === b);
      g.addEventListener("mouseenter", () => { wrap.classList.add("hovering"); g.classList.add("on"); $$(`.mlink[data-a="${b}"], .mlink[data-b="${b}"]`, wrap).forEach(l => { l.classList.add("on"); $$(`.mnode[data-b="${l.dataset.a}"], .mnode[data-b="${l.dataset.b}"]`, wrap).forEach(n => n.classList.add("near")); }); });
      g.addEventListener("mousemove", ev => showTip(b === OTHER ? tipHtml("Other banks", [], [["Banks not on the map", fmt(stats.length - top.length)], ["", "Show more banks to bring them onto the map"]]) : tipHtml(SX.name(b), [], [["Country", esc(SX.country(b))], ["Schemes", fmt(x.n)], ["Entries / exits", `${x.en} / ${x.ex}`], ["Role", ROLE[x.role][0]], ["", "Click to open this bank"]]), ev.clientX, ev.clientY));
      g.addEventListener("mouseleave", () => { wrap.classList.remove("hovering"); $$(".on, .near", wrap).forEach(n => n.classList.remove("on", "near")); hideTip(); });
      if (b !== OTHER) { g.addEventListener("click", () => openBankL(b, STATE["map-types"])); g.addEventListener("keydown", ev => { if (ev.key === "Enter") openBankL(b, STATE["map-types"]); }); }
    });
    $$(".mlink", wrap).forEach(g => {
      const l = L.find(y => String(y.a) === g.dataset.a && String(y.b) === g.dataset.b);
      g.addEventListener("mouseenter", () => { wrap.classList.add("hovering"); g.classList.add("on"); $$(`.mnode[data-b="${g.dataset.a}"], .mnode[data-b="${g.dataset.b}"]`, wrap).forEach(n => n.classList.add("near")); });
      g.addEventListener("mousemove", ev => showTip(tipHtml(`${SX.name(l.a)} → ${SX.name(l.b)}`, [], [["Schemes", fmt(l.schemes)], ["Transfers", fmt(l.t)], ["Total USD", usd(l.usd)]]), ev.clientX, ev.clientY));
      g.addEventListener("mouseleave", () => { wrap.classList.remove("hovering"); $$(".on, .near", wrap).forEach(n => n.classList.remove("on", "near")); hideTip(); });
    });
    const blist = (k, el) => { const arr = stats.filter(x => x[k] > 0).sort((a, b) => b[k] - a[k]).slice(0, S.n);
      $(el).innerHTML = arr.map((x, i) => `<button class="brow" data-b="${x.b}"><span class="muted num">${i + 1}</span><i style="background:${ROLE[x.role][1]}"></i><span class="grow"><b>${esc(SX.name(x.b))}</b> <span class="muted">${esc(SX.country(x.b))}</span></span><span class="num">${x[k]} scheme${x[k] === 1 ? "" : "s"}</span>${ic("chevron-right")}</button>`).join("");
      $$(`${el} [data-b]`).forEach(bt => bt.addEventListener("click", () => openBankL(+bt.dataset.b, STATE["map-types"]))); };
    blist("en", "#mTopIn"); blist("ex", "#mTopOut");
    const opts = Object.values(SX.PROF).filter(p => types.includes(p.scheme_type)).sort((a, b) => b.total_usd - a.total_usd);
    $("#anySch").innerHTML = opts.map(p => `<option value="${p.scheme_id}">#${p.scheme_id} ${p.scheme_type}: ${p.n_transfers} transfers, ${p.n_banks} banks, ${usd(p.total_usd)}</option>`).join("");
  };
  multiSelect($("#mTypes"), "map-types", SX.TYPES, SX.TYPES.length, s => { STATE["map-types"] = s; draw(); }, Object.fromEntries(SX.TYPES.map(t => [t, Object.values(SX.PROF).filter(p => p.scheme_type === t).length + " schemes"])));
  $("#mNWrap").innerHTML = stepper("mN", "Banks on the map", S.n, 1, 60, 1);
  wireStepper($("#mN"), 1, 60, v => { S.n = v; draw(); });
  $("#mReset").addEventListener("click", () => { delete STATE.sx; delete STATE["map-types"]; renderTab(); });
  $("#anyGo").addEventListener("click", () => openSchemeL(+$("#anySch").value));
  // the eight types, each drawn from its most typical scheme (the median number of transfers)
  $("#mTypesGrid").innerHTML = SX.TYPES.map(t => {
    const ps = Object.values(SX.PROF).filter(p => p.scheme_type === t).sort((a, b) => a.n_transfers - b.n_transfers || a.scheme_id - b.scheme_id), ex = ps[Math.floor(ps.length / 2)];
    return `<button class="tcard" data-sid="${ex.scheme_id}"><div class="sc-panel">${schemeSvg(schemeModel(ex.scheme_id), 232, { small: true })}</div><div class="sc-body"><b>${t}</b><p>${esc(TYPE_INFO[t][0])}</p><span class="sc-m">${ps.length} schemes · example #${ex.scheme_id}</span></div></button>`;

  draw(); redraws.add(draw);
}

      <div class="card head">${spot("schemes")}<div><div class="label">Bank in the most schemes</div><div class="value md">${esc(SX.name(b0.b))}</div><div class="note">${b0.n} of ${fmt(Object.keys(SX.PROF).length)} schemes</div></div></div>
    </div>
    <div class="grid g4 sumrow">
      ${card("share", "Payment formats", "Laundering share", "flow", t3(flow).map(r => ({ name: esc(r.cat), sub: `Normal ${pct(r.normal, 1)}`, v: r.laundering, val: pct(r.laundering, 1) })), flow[0].laundering, { cls: "b-l" })}
      ${card("routes", "Riskiest routes", "Laundering rate (30+ txns)", "country", t3(rateTop).map(p => ({ name: `${esc(p.from_country)} → ${esc(p.to_country)}`, sub: `${fmt(p.n_laundering)} of ${fmt(p.total)}`, v: p.rate, val: rateFmt(p.rate) })), rateTop[0].rate, { cls: "b-l" })}
      ${card("bankflow", "Entry banks", "Entries vs size", "bank", t3(entryTop).map(b => ({ name: esc(b.bank_name), sub: `${esc(b.country)} · ${b.entries} entries`, v: b.entry_ratio, val: b.entry_ratio.toFixed(1) + "×", act: "bank:" + b.bank_id })), entryTop[0].entry_ratio, { cls: "b-l" })}
      ${card("bankflow", "Exit banks", "Exits vs size", "bank", t3(exitTop).map(b => ({ name: esc(b.bank_name), sub: `${esc(b.country)} · ${b.exits} exits`, v: b.exit_ratio, val: b.exit_ratio.toFixed(1) + "×", act: "bank:" + b.bank_id })), exitTop[0].exit_ratio, { cls: "b-l" })}
    </div>`;
  $$("[data-sgo]", panel).forEach(b => b.addEventListener("click", () => $(`[data-tab="${b.dataset.sgo}"]`).click()));
  $$("[data-act]", panel).forEach(li => {
    const go = () => { const [k, id] = li.dataset.act.split(":"); k === "bank" ? openBankL(+id) : openSchemeL(+id); };
    li.addEventListener("click", go); li.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  });
}

/* ---------- loading popup: a small dialog over a blurred page, shown every time data loads ---------- */
const LOAD_ART = () => `<svg class="ld-art" viewBox="0 0 220 120" aria-hidden="true">
  <path class="ld-route" d="M52 70C88 22 132 22 168 70"/>
  <g class="art"><g transform="translate(10 40)">${bankG(0, 0, 46, "b")}</g>
  <g transform="translate(168 44)"><rect class="p" x="0" y="0" width="42" height="52" rx="5"/><rect class="w" x="8" y="10" width="26" height="4" rx="2"/><rect class="w" x="8" y="20" width="26" height="4" rx="2"/><rect class="w" x="8" y="30" width="16" height="4" rx="2"/>
    <rect class="ld-fill s" x="8" y="40" width="26" height="4" rx="2"/></g>
  <g class="ld-note">${note(-16, -10, 32, 20, "l")}</g>
  <g class="ld-coins"><g class="c1">${coin(86, 100, 8, "s")}</g><g class="c2">${coin(110, 100, 8, "s")}</g><g class="c3">${coin(134, 100, 8, "s")}</g></g></g></svg>`;
let loadSeq = 0, loadIv = null, loadSlow = null;
const loadTitle = p => p.kind === "bq1" ? "Loading BQ1 account profiles" : "Loading BQ2 cross-bank movement";
const loadSteps = p => [`Opening ${p.run || "HI-Medium (current)"}`, "Querying Athena", "Reading the results", "Checking the data"];
/* Opens the popup. live = waiting on Athena: the steps advance and stop on the last one until hideLoader(). */
function showLoader(title, steps, live, ms) {
  const id = ++loadSeq;
  let w = $("#loader");
  if (!w) { w = document.createElement("div"); w.id = "loader"; w.className = "loadwrap"; document.body.appendChild(w); }
  w.innerHTML = `<div class="loadcard" role="alertdialog" aria-modal="true" aria-labelledby="ldT">${LOAD_ART()}<h2 id="ldT">Loading</h2>
    <div class="ld-bar" role="progressbar" aria-label="Loading"><i></i></div></div>`;
  w.classList.remove("closing"); w.classList.add("show"); document.body.classList.add("loading");
  hideTip(); closeMenus();
  clearInterval(loadIv); clearTimeout(loadSlow);
  let i = 0;
  loadIv = setInterval(() => { i = Math.min(i + 1, steps.length - 1); const s = $("#ldS"); if (s) s.textContent = steps[i] + "…"; }, live ? 2500 : ms / steps.length);
  if (live) loadSlow = setTimeout(() => { const n = $("#ldN"); if (n) n.textContent = "This is taking longer than usual. Athena may be busy; if nothing happens, reload the page."; }, 90000);
  return id;
}
function hideLoader(id) {
  if (id !== undefined && id !== loadSeq) return;
  clearInterval(loadIv); clearTimeout(loadSlow);
  const w = $("#loader"); if (!w || !w.classList.contains("show")) return;
  const s = $("#ldS"); if (s) s.textContent = "Drawing the charts…";
  w.classList.add("closing"); document.body.classList.remove("loading");
  const seq = loadSeq;
  setTimeout(() => { if (seq === loadSeq) w.classList.remove("show", "closing"); }, 220);
}
function withLoading(title, fn, ms = 900, steps) {
  steps = steps || ["Querying Athena", "Checking the data", "Drawing the charts"];
  const id = showLoader(title, steps, false, ms);
  setTimeout(() => { if (id !== loadSeq) return; try { fn(); } finally { hideLoader(id); } }, ms);
}
const openBankL = (b, types) => withLoading(`Loading ${SX.name(b)}`, () => openBank(b, types), 550, ["Querying the bank's schemes", "Linking the transfers"]);
const openSchemeL = (sid, bank) => withLoading(`Loading scheme #${sid}`, () => openScheme(sid, bank), 500, ["Querying the transfers", "Laying out the accounts"]);

/* ---------- router ---------- */
function route() {
  const p = BY_PATH[currentPath] || BY_PATH.home;
  if (p.run) selectedRun = p.run;
  renderNav(p.path);
  const page = $("#page");
  page.style.animation = "none"; void page.offsetWidth; page.style.animation = "";
  redraws.clear(); hideTip(); closeMenus();
  if ($("#appearance")) toggleAppearance();
  document.title = p.kind === "home" ? "Following the Money" : `${p.kind.toUpperCase()} · ${p.run || "HI-Medium (current)"} · Following the Money`;
  if (p.kind === "home") { page.innerHTML = homePage(); wireHome(); }
  else if (DATA.error) { page.innerHTML = errorPage(p); wireRunPicker(p); }
  else if (p.kind === "bq1") { page.innerHTML = bq1Page(p); wireRunPicker(p); wireBq1(); }
  else { page.innerHTML = bq2Page(p); wireRunPicker(p); wireTabs(); }
  closeNav(true);
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}
/* side nav: hidden until the pointer reaches the handle or the left edge; a click pins it open */
const appEl = $("#app"), navHandle = $("#navHandle"), sidenav = $("#sidenav");
let navTimer;
function openNav(pin) { clearTimeout(navTimer); navTimer = null; appEl.classList.add("nav-open"); if (pin) appEl.classList.add("nav-pinned"); navHandle.setAttribute("aria-expanded", "true"); }
function closeNav(now) {
  const f = () => { navTimer = null; appEl.classList.remove("nav-open", "nav-pinned"); navHandle.setAttribute("aria-expanded", "false"); };
  if (now) { clearTimeout(navTimer); f(); } else if (!appEl.classList.contains("nav-pinned") && !navTimer) navTimer = setTimeout(f, 300);
}
[navHandle, $("#navEdge")].forEach(el => el.addEventListener("mouseenter", () => openNav(false)));
// close once the pointer moves away from the open menu (position based, so it works even when the menu slides under a still pointer)
document.addEventListener("pointermove", e => {
  if (e.pointerType === "touch" || !appEl.classList.contains("nav-open") || appEl.classList.contains("nav-pinned")) return;
  // the menu's resting box (left 0, under the top bar), not its sliding position
  if (e.clientX > sidenav.offsetWidth + 24 || e.clientY < 48) closeNav(false); else { clearTimeout(navTimer); navTimer = null; }
});
document.documentElement.addEventListener("mouseleave", () => closeNav(false));
navHandle.addEventListener("click", e => { e.stopPropagation(); openNav(true); const f = $("#sidenav .sn-item"); if (f) f.focus({ preventScroll: true }); });
sidenav.addEventListener("click", e => e.stopPropagation());
$("#scrim").addEventListener("click", () => closeNav(true));
document.addEventListener("keydown", e => { if (e.key === "Escape" && appEl.classList.contains("nav-open")) { closeNav(true); navHandle.focus(); } });
hydrateIcons();
$("#appearanceBtn").addEventListener("click", e => { e.stopPropagation(); toggleAppearance(); });
/* ---------- live data: this page runs inside Streamlit as a custom component ----------
   Python (common/ui.py) sends {runs, path, n, data | pending} with every render.
   go() sends {path, n} back; Python loads that page's data from Athena and renders again. */
function srcBadge() {
  const m = DATA.meta || {};
  return m.source === "csv"
    ? `<span class="lozenge warning" title="Athena could not be reached, so this page shows the CSV export in data_bq1/">CSV export</span>`
    : m.saved
      ? `<span class="lozenge success" title="Athena results saved in S3 by an earlier view (${esc(m.db || "")}), so no query ran">Saved results from S3</span>`
      : `<span class="lozenge success" title="Queried in Athena (${esc(m.db || "")}) and saved in S3 for the next view">Live from Athena</span>`;
}
function errorPage(p) {
  const run = p.run || "HI-Medium (current)";
  return `${crumbs([{ label: "Home", go: "home" }, { label: run }, { label: p.kind.toUpperCase() }])}
  <div class="hero"><div><h1 class="sm">${p.kind === "bq1" ? "Daily AML investigator queue" : "How do laundering networks move funds across banks?"}</h1>
    <div class="actions">${runPicker(p)}</div></div>${art(p.kind === "bq1" ? "rank" : "network", "sm")}</div>
  <div class="errbox" role="alert">${ic("cross-circle")}<div><h3>Could not load ${esc(run)} from Athena</h3>
    <p>The page could not read its data. Try again, or pick another run above.</p><pre>${esc(DATA.error)}</pre>
    <button class="btn primary" data-go="${p.path}">${ic("refresh")}Try again</button></div></div>`;
}
const ST = {
  n: 0, applied: null, shown: null,
  post(type, extra) { try { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), "*"); } catch (e) {} },
  send(value) { this.post("streamlit:setComponentValue", { value, dataType: "json" }); },
};
function onRender(a) {
  buildPages(a.runs || []); ST.runsError = a.runs_error || "";
  if (a.pipeline) ST.pipe = a.pipeline;
  const runsSig = (a.runs || []).map(r => r.run).join(","), runsChanged = ST.runsSig !== undefined && runsSig !== ST.runsSig;
  ST.runsSig = runsSig;
  if (ST.shown === "home" && !a.pending) {   // the upload list and run list refresh without redrawing home
    drawPipe();
    const box = $("#runsBox"); if (runsChanged && box) { box.innerHTML = runsBox(); wireRuns(); }
  }
  const path = BY_PATH[a.path] ? a.path : "home", p = BY_PATH[path];
  const key = `${path}|${a.n || 0}|${a.pending ? "pending" : "data"}`;
  if (key === ST.applied) return;               // the same render again (Streamlit reran for another reason)
  ST.applied = key; ST.n = Math.max(ST.n, a.n || 0);
  if (a.pending) { currentPath = path; renderNav(path); showLoader(loadTitle(p), loadSteps(p), true); return; }
  if (p.kind !== "home") {
    Object.keys(DATA).forEach(k => { if (k !== "runs") delete DATA[k]; });
    Object.assign(DATA, a.data || { error: "No data came back for this page." });
    (DATA.hold || []).forEach(h => { if (h.bucket === "never") h.bucket = NOT_SENT; });
    SX = null; BQ = null; Object.keys(STATE).forEach(k => delete STATE[k]);
  } else if (ST.shown === "home") { hideLoader(); return; }   // home is drawn locally, nothing to redo
  currentPath = path; ST.shown = path;
  route(); hideLoader();
}
window.addEventListener("message", e => { const d = e.data; if (d && d.type === "streamlit:render") onRender(d.args || {}); });
ST.post("streamlit:componentReady", { apiVersion: 1 });
ST.post("streamlit:setFrameHeight", { height: Math.max(600, (window.parent && window.parent.innerHeight) || 800) });
/* Streamlit creates component frames with scrolling="no", so the frame itself cannot scroll.
   The body is the scroller instead (html.inner-scroll), with the scrollbar hidden. */
document.documentElement.classList.add("inner-scroll");

</script>
